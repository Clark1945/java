server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: product-service
#            uri: http://localhost:8080
            uri: http://product-service:8080
            predicates:
              - Path=/api/products/**
            filters:
              - RewritePath=/api/products/(?<segment>.*), /product-service/${segment}
          globalcors:
            corsConfigurations: # CORS 設定或 JWT 驗證等
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

