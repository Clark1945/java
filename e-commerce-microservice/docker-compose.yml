version: '3.8'

services:
  config-server:
    build: ./e-commerce-config-server
    image: config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - backend

  eureka-server:
    build: ./e-commerce-eureka-server
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - backend
    depends_on:
      - config-server

  gateway:
    build: ./e-commerce-api-gateway
    image: gateway-service:latest
    container_name: gateway
    ports:
      - "8081:8081"
    networks:
      - backend
    depends_on:
      - product-service
      - eureka-server
      - config-server

  product-service:
    build: ./e-commerce-product
    image: product-service:latest
    container_name: product-service
    networks:
      - backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - eureka-server
      - config-server

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_DB=product
      - POSTGRES_USER=root1234
      - POSTGRES_PASSWORD=root1234
    ports:
      - "5432:5432"
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend

networks:
  backend:

volumes:
  minio-data:
