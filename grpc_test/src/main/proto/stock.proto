syntax = "proto3";

option java_package = "com.example.grpc.streaming";
option java_multiple_files = true;

package streaming;

service StockService {
  rpc SubscribePrice (SubscribeRequest) returns (stream PriceUpdate);
}

message SubscribeRequest {
  string symbol = 1;
}

message PriceUpdate {
  string symbol = 1;
  double price = 2;
}
