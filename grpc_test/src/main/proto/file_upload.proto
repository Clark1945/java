syntax = "proto3";

option java_package = "com.example.grpc.streaming";
option java_multiple_files = true;

package streaming;

service FileUploadService {
  rpc UploadFile (stream FileChunk) returns (UploadResult);
}

message FileChunk {
  bytes data = 1;
}

message UploadResult {
  string file_id = 1;
  int64 total_bytes = 2;
}
